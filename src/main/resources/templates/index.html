<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head::head('eGen - Main')}"></head>
<body>
<header th:replace="~{fragments/header::navbar}"></header>

<main class="container">
    <div class="content-wrapper">
        <section class="left-col">
            <h1 class="main-title"><strong>eGen</strong> <span class="thin">codon analysis tool</span></h1>

            <div class="input-card">
                <label>Enter DNA sequence</label>
                <textarea id="dna-input" th:text="${sequence}" placeholder="ATGGCTTGA..."></textarea>
            </div>

            <div class="button-row">
                <button id="btn-analyze" class="btn-blue">Analyze</button>
                <button id="btn-upload-trigger" class="btn-blue">Upload file</button>
                <input type="file" id="file-input" style="display: none;" />
            </div>
        </section>

        <section class="right-col">
            <div class="result-section">
                <h3>Summary</h3>
                <div class="summary-grid">
                    <div class="grid-box">
                        <label>Length</label>
                        <span id="res-length" class="value">0</span>
                    </div>
                    <div class="grid-box">
                        <label>Codons</label>
                        <span id="res-codons" class="value">0</span>
                    </div>
                    <div class="grid-box">
                        <label>Start codon</label>
                        <span id="res-start" class="value">None</span>
                    </div>
                    <div class="grid-box">
                        <label>Stop codon</label>
                        <span id="res-stop" class="value">None</span>
                    </div>
                </div>
            </div>

            <div class="result-section">
                <h3>RNA</h3>
                <div id="res-rna" class="result-box">-</div>
            </div>

            <div class="result-section">
                <h3>Known mutations</h3>
                <div id="res-mutations" class="result-box mutation-box" style="flex-direction: column; align-items: stretch; max-height: 300px; overflow-y: auto;">
                    <div id="anomaly-list-placeholder">
                        <p><strong>None</strong></p>
                        <small>No known mutation detected</small>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <div th:replace="~{fragments/article-manager}"></div>
</main>

<footer th:replace="~{fragments/footer::footer}"></footer>
<script type="module" th:src="@{/js/elements.js}"></script>
<script type="module">

import init, { analyze } from "/js/libegen.js";
await init();
const UI = {
    input: document.getElementById('dna-input'),
    btnAnalyze: document.getElementById('btn-analyze'),
    btnUploadTrigger: document.getElementById('btn-upload-trigger'),
    fileInput: document.getElementById('file-input'),
    resLength: document.getElementById('res-length'),
    resCodons: document.getElementById('res-codons'),
    resStart: document.getElementById('res-start'),
    resStop: document.getElementById('res-stop'),
    resRna: document.getElementById('res-rna'),
    mutStatus: document.getElementById('mut-status'),
    mutDetails: document.getElementById('mut-details'),
    mutContainer: document.getElementById('res-mutations')
};

const anomalyDescriptions = {
    ["InvalidInput"]: (a) => `Invalid character '${a.codon}' at position ${a.position}`,
    ["InproperStart"]: (a) => `Start codon mutation`,
    ["InproperEnd"]: (a) => `Stop codon missing at end of sequence`,
    ["EarlyAmber"]: (a) => `Early stop codon (Amber) at position ${a.position}`,
    ["EarlyUmber"]: (a) => `Early stop codon (Umber) at position ${a.position}`,
    ["EarlyOchre"]: (a) => `Early stop codon (Ochre) at position ${a.position}`,
    ["InvalidAlignment"]: (a) => `Sequence alignment error`,
    ["LowEntropy"]: (a) => `Abnormal GAC count (${a.count}) at position ${a.position}`
};

function updateUI(results) {
    if (!results) return;

    UI.resLength.innerText = results.nucleotidesCount || 0;
    UI.resCodons.innerText = Math.floor((results.nucleotidesCount || 0) / 3);

    UI.resStart.innerText = "OK";
    UI.resStart.classList.remove('alert');
    UI.resStop.innerText = "OK";
    UI.resStop.classList.remove('alert');

    UI.mutContainer.innerHTML = '';

    if (results.anomalies && results.anomalies.length > 0) {
        results.anomalies.forEach(a => {
            let anomalyType;
            let anomalyData = {};

            if (typeof a === "string") {
                anomalyType = a;
                anomalyData = {}; 
            } else if (typeof a === "object" && a !== null) {
                anomalyType = Object.keys(a)[0];
                if (typeof a[anomalyType] === "object" && a[anomalyType] !== null)
                    anomalyData = a[anomalyType];
                else anomalyData = { position: a[anomalyType] };
            }

            if (anomalyType === "InproperStart") {
                UI.resStart.innerText = "Mutation";
                UI.resStart.classList.add('alert');
            }
            if (anomalyType === "InproperEnd") {
                UI.resStop.innerText = "Missing";
                UI.resStop.classList.add('alert');
            }

            const item = document.createElement('div');
            item.style.borderBottom = "1px solid #eee";
            item.style.padding = "8px 0";

            const descFn = anomalyDescriptions[anomalyType];
            const textDescription = typeof descFn === "function" ? descFn(anomalyData) : `Unknown anomaly (${anomalyType})`;

            item.innerHTML = `<p style="margin:0; font-weight:bold;">${anomalyType}</p>
                <small style="color: #666;">${textDescription}</small>`;
            UI.mutContainer.appendChild(item);
        });
    }
    UI.resRna.innerText = results.mode === 64 ? "Sequence is RNA" : "DNA sequence processed";
}

UI.btnAnalyze.addEventListener('click', async () => {
    const text = UI.input.value;
    if (!text) return;
    const results = analyze(text);
    updateUI(results);
});

UI.btnUploadTrigger.addEventListener('click', () => UI.fileInput.click());

UI.fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = file.stream().getReader();
    const decoder = new TextDecoder();
    const totalResults = {nucleotidesCount: 0,mode: 0,anomalies: []};
    const CHUNK_LIMIT = 30 * 1024 * 1024; 
    let currentBuffer = new Uint8Array(0);
    let globalPosition = 0;

    try {
        while (true) {
            const { done, value } = await reader.read();
            if (value) {
                let newBuffer = new Uint8Array(currentBuffer.length + value.length);
                newBuffer.set(currentBuffer);
                newBuffer.set(value, currentBuffer.length);
                currentBuffer = newBuffer;
            }
            if (currentBuffer.length >= CHUNK_LIMIT || (done && currentBuffer.length > 0)) {
                const textChunk = decoder.decode(currentBuffer, { stream: !done });
                const chunkResult = analyze(textChunk);

                totalResults.nucleotidesCount += (chunkResult.nucleotidesCount || 0);
                if (chunkResult.mode) totalResults.mode = chunkResult.mode;
                if (chunkResult.anomalies && chunkResult.anomalies.length > 0) {
                    chunkResult.anomalies.forEach(a => {
                        if (typeof a === "object" && a !== null) {
                            const type = Object.keys(a)[0];
                            const data = a[type];
                            if (typeof data === "object" && data !== null && data.position !== undefined) 
                                data.position += globalPosition;
                            else if (typeof data === "number")
                                a[type] = data + globalPosition;
                        }
                        totalResults.anomalies.push(a);
                    });
                }
                
                globalPosition += textChunk.length;
                currentBuffer = new Uint8Array(0);
            }
            if (done) break;
        }
        updateUI(totalResults);

    } catch (err) {
        console.error("Ошибка при поблочном анализе файла:", err);
    }
});
</script>
</body>
</html>
