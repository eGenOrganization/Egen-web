<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <header th:fragment="navbar(activePage)">
        <script th:src="@{/js/language.js}"></script>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <nav>
            <a th:text="${mainPage}" th:href="@{/}" th:class="${activePage == 'home' ? 'active' : ''}"></a>
            <a th:text="${secondPage}" th:href="@{/second-page}" th:class="${activePage == 'profile' ? 'active' : ''}"></a>
            
            <select id="langIds" onchange="changeLanguage(this.value)">
                <option value="uk" th:selected="${#locale.language == 'uk' || #locale.language == 'ua'}">Українська</option>
                <option value="en" th:selected="${#locale.language == 'en'}">English</option>
            </select>
        </nav>
        <hr>
    </header>
</html>
