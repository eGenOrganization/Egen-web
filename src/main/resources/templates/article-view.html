<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head::head('eGen - Article')}">
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .alert { background: #fff3cd; padding: 10px; border-left: 5px solid #ffc107; margin-bottom: 20px; }
        .premium-badge { background: #007bff; color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.8em; }
        img { max-width: 100%; height: auto; display: block; margin: 20px 0; }
    </style>
</head>
<body>
<header th:replace="~{fragments/header::navbar}"></header>

<main>
    <h1 th:text="${article.title}">Default Title</h1>
    <div class="meta">
        Author: <span th:text="${article.authorName}">Author</span>
        <span th:if="${isPremiumUser}" class="premium-badge">PRO Reader</span>
        <br>
        Published: <span th:text="${formattedDate}">01.01.2026</span>
    </div>
    <div th:utext="${systemNotice}"></div>
    <hr>
    <article th:utext="${article.content}">The main text of the article with styles from the database goes here...</article>
</main>

</body>
</html>
